name: Windows tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q roccatmouse tray.py tyon_capture_gui.py tyon_gui.py tyon_input.py tyon_monitor.py tyon_rgb.py tyon_store.py tyon_widgets.py tests
